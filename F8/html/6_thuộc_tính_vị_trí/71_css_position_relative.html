  <!DOCTYPE html>
  <html>
      <head>
          <meta charset="utf-8"/>
          <title>Position relative</title>
          <style>

            .box1 {
                width: 100px;
                height: 100px;
                background-color: pink;
                position: relative;
                top: 50px;
                left: 40px;
            }

            .box2 {
                margin-top: 30px;
                width: 200px;
                height: 200px;
                background-color: skyblue;
            }
  
              ul {
                  height: 2000px;
              }
          
          </style>
      </head>
      <body>
          <div class="box1"></div>
          <div class="box2"></div>
          <h1>Position</h1>
          <ul>
              <li>Relative</li>
              <li>Absolute</li>
              <li>Fixed</li>
              <li>Sticky</li>
          </ul>
      </body>
  </html>
